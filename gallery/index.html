<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .gallery-container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }
        .grid-item {
            background: #0a0a0a;
            border: 1px solid #33000f;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .grid-item:hover {
            border-color: #ff003c;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
            transform: translateY(-3px);
        }
        .grid-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ff003c;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-shadow: 0 0 8px rgba(255, 0, 60, 0.8);
        }

        /* Estilos del Modal (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox-content {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.6);
            transition: transform 0.3s ease;
            transform-origin: center;
            cursor: zoom-in;
        }
        .lightbox-content.zoomed {
            transform: scale(2);
            cursor: zoom-out;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 2.5rem;
            cursor: pointer;
            background: none;
            border: none;
            text-shadow: 0 0 10px #ff003c;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid #ff003c;
            color: #ffffff;
            font-size: 2rem;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .lightbox-nav:hover {
            background: #ff003c;
            box-shadow: 0 0 15px #ff003c;
        }
        #prevBtn { left: 30px; }
        #nextBtn { right: 30px; }
        .hidden { display: none !important; }
    </style>
</head>
<body style="display: block; padding: 40px 0;">
    <div class="gallery-container" style="margin: 0 auto;">
        <a href="../index.html" class="back-link">← Volver al inicio</a>
        <h1>Galería</h1>
        <p class="subtitle">Capturas y momentos de mi vida.</p>
        
        <div class="grid">
            <!-- Ejemplo de imagen 1 -->
            <div class="grid-item">
                <img src="entrenamiento1.jpg" alt="Entrenamiento 05/09/2026">
            </div>
            <!-- Ejemplo de imagen 2 -->
            <div class="grid-item">
                <img src="imagen2.jpg" alt="Aqui me falta una aventura...">
            </div>
        </div>
    </div>

    <!-- Contenedor del Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" id="closeBtn">&times;</button>
        <button class="lightbox-nav" id="prevBtn">&#10094;</button>
        <img class="lightbox-content" id="lightboxImg" alt="Ampliada">
        <button class="lightbox-nav" id="nextBtn">&#10095;</button>
    </div>

    <script>
        const gridItems = document.querySelectorAll('.grid-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentIndex = 0;
        const imagesSrc = Array.from(gridItems).map(img => img.src);

        function updateLightbox() {
            lightboxImg.src = imagesSrc[currentIndex];
            lightboxImg.classList.remove('zoomed');
            
            // Ocultar o mostrar flechas dinámicamente si no hay más fotos
            if (imagesSrc.length <= 1) {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
            } else {
                prevBtn.classList.toggle('hidden', currentIndex === 0);
                nextBtn.classList.toggle('hidden', currentIndex === imagesSrc.length - 1);
            }
        }

        gridItems.forEach((img, index) => {
            img.addEventListener('click', () => {
                currentIndex = index;
                updateLightbox();
                lightbox.classList.add('active');
            });
        });

        closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));
        
        // Cerrar si haces click fuera de la imagen
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) lightbox.classList.remove('active');
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateLightbox();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < imagesSrc.length - 1) {
                currentIndex++;
                updateLightbox();
            }
        });

        // Zoom táctil / clic en la imagen
        lightboxImg.addEventListener('click', () => {
            lightboxImg.classList.toggle('zoomed');
        });
    </script>
</body>
</html>
