<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baruc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bio-card">
        <h1>Me llaman Baruc</h1>
        <p class="subtitle">🟥</p>
        
        <div class="clock-container">
            <span>Mi Reloj: </span><span id="live-clock">⌚</span>
        </div>

        <div class="links">
            <a href="https://www.instagram.com/baruc.me/" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/@baruc.me" target="_blank">Tik Tok</a>
            <a href="https://www.baruc.me/gallery">Galería</a>
            <a href="https://www.baruc.me/dm">MSGs</a>
        </div>
    </div>

    <script>
        function updateClock() {
            const options = { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const timeString = new Date().toLocaleTimeString('es-MX', options);
            document.getElementById('live-clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
